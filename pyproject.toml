[project]
name = "energy-demand-forecasting"
version = "0.1.0"
description = "Electricity demand forecasting from public data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.108",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
fetch-data = "energy_demand_forecasting.data:main"
run-backtest = "energy_demand_forecasting.pipeline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
